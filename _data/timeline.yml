# Timeline data for 时代回响 page — 双线年表
# macro: 中国互联网的大时代；pengcheng: 同一时刻蓬城发生了什么
- year: 1994
  title: 一根 64K 的线
  macro: "4 月 20 日，中关村教育与科研示范网络通过美国 Sprint 公司接入 64K 国际专线。中国全功能接入互联网。此时全国网民不到 1 万人，上网是一件需要单位介绍信的事。"
  highlight: false

- year: 1998–1999
  title: 门户、OICQ 与第一次泡沫
  macro: "新浪、搜狐、网易相继成立，门户时代开启。1999 年 2 月，腾讯推出 OICQ；同年 9 月，马云在杭州创办阿里巴巴。2000 年 3 月，纳斯达克崩盘，第一次互联网泡沫破裂，无数 '.com' 在一夜之间消失。"
  pengcheng: "在泡沫破裂的同一时期，五邑大学蓬城俱乐部的大学生们正在宿舍里用 ASP 搭一个交友网站。没有投资，没有 BP，只有一台服务器和一群想认识外校同学的人。"
  highlight: false

- year: 1999–2000
  title: "★ 蓬城上线"
  macro: "中国网民在 2000 年底达到约 2,250 万。网吧开始遍布城市街头，'上网'第一次成为年轻人的日常消费。"
  pengcheng: "蓬城交友中心上线。联系地址是'广东省江门五邑大学蓬城俱乐部 AP99081 信箱'，创始人伍柳昌、吴锋成、苏华胜、廖海涛。2000 年 10 月 21 日，站长 aaron 在社区注册——这是目前能找到的最早会员时间戳。"
  highlight: true

- year: 2001
  title: 加入 WTO，也加入网吧时代
  macro: "12 月，中国正式加入 WTO。全国网民约 2,650 万，网吧里最流行的游戏是《星际争霸》《帝国时代》和《CS》。这一年，中国互联网还很小，但每个人都在谈论它。"
  pengcheng: "蓬城会员达到 4,139 人。6 月 30 日至 7 月 2 日，主机宕机三天，站长专门发了事故公告；10 月 11 日，网站举办首届'星际·罗马大赛'；12 月 6 日，aaron 在留言簿写下：'我地学校装左 ADSL 啦！'"
  quote: "我地学校装左 ADSL 啦！—— aaron，留言簿，2001-12-06"
  highlight: true

- year: 2002
  title: 蓝极速之后，网吧不再一样
  macro: "6 月 16 日，北京'蓝极速'网吧发生火灾，25 人遇难。全国随即展开网吧专项整治，未成年人上网、通宵营业被严格限制。同年，短信业务爆发，门户网站靠 SP 业务第一次真正赚到钱。"
  pengcheng: "蓬城会员涨到 9,756 人。首页接入网易短信中心，并与盈东网吧结成合作伙伴——一边是越来越严的网吧监管，一边是学生们对'包夜上网'的狂热。论坛此时已扩展到 60 多个版面。"
  quote: "强烈要求开放商店,教堂!! —— 豪鬼，社区总部，2002"
  highlight: true

- year: 2003
  title: 非典、淘宝与 13,397 个 ID
  macro: "非典让线下生活停摆，却把更多人推到了网上。5 月，淘宝上线；10 月，支付宝推出。中国互联网开始从'看新闻、聊天'转向'交易'。"
  pengcheng: "蓬城会员达到 13,397 人，是目前能找到的峰值。首页写着'留言板重新开放'，还挂着四家本地企业的建站案例：金域电脑、金信植绒机厂、俊力五金工艺厂、中山先锋电器厂。"
  quote: "不求与人相比，只求超越自己！—— aaron，站长签名"
  highlight: true

- year: 2004
  title: 上市、网游，与一所学校的消失
  macro: "腾讯在香港上市，盛大登陆纳斯达克，网络游戏成为最赚钱的生意。中国网民突破 9,400 万。也是这一年 7 月，江门教育学院并入新成立的江门职业技术学院——蓬城最重要的线下据点，从建制上消失了。"
  pengcheng: "5 月，首页仍写着会员 13,397。到 12 月，pch88.com 已经变成 Sedo 的域名停放页，标价 10,000 美元。没有告别公告，也没有最后一条留言。"
  highlight: true

- year: 2005–2009
  title: Web 2.0：从门户到'我'
  macro: "博客、校内网、豆瓣、土豆、优酷相继出现。2008 年，汶川地震与北京奥运把中国网民第一次大规模组织到线上，网民数达到 2.98 亿。2009 年，新浪微博上线，3G 发牌。"
  pengcheng: "蓬城已经消失。它的域名在域名市场里漂流，偶尔被停放页、广告联盟和'此域名出售'占据。那些在留言簿里约好'有缘再见'的人，散落在了 QQ 群、校内网和后来的微信里。"
  highlight: false

- year: 2010–2014
  title: 墙内繁荣
  macro: "2010 年，Google 退出中国大陆搜索市场；微博与 3Q 大战让平台权力第一次显现。2011 年微信诞生。2013 年 4G 发牌。2014 年，4G 全面商用，移动支付与双 11 爆发；同年，Instagram 等境外社交平台在中国大陆无法直接访问，'墙内'的移动生态加速成型。"
  pengcheng: "蓬城只剩域名。2011 年 2 月，鹏城.com 由上海数易 / domaindeal.cn 停放出售，页面上是一篇《网络域名和企业品牌战略》——一个校园社区的名字，变成了域名投资人眼里的'品牌资产'。"
  highlight: false

- year: 2015–2019
  title: 短视频、贸易战与学习强国
  macro: "'互联网+'写进政府工作报告，直播、共享单车、移动支付席卷街头。2017 年《网络安全法》实施，VPN 与境外内容管理收紧。2018 年，抖音崛起，中美贸易战与中兴事件让'芯片'成为全民话题；同年游戏版号冻结，境外影视与游戏内容引进收紧。2019 年 1 月 1 日，'学习强国'App 上线；同年 6 月，5G 商用牌照发放。"
  pengcheng: "2019 年 8 月 6 日，pch88.com 在易名中国以一口价 ¥5,000 挂牌，页面版权年份写着 2018。曾经 13,397 个会员的社区，最后只剩一个可以'立即出价'的按钮。"
  quote: "This domain is for sale. 您正在访问的域名可以转让 !—— 易名中国交易页，2019"
  highlight: true

- year: 2020–2023
  title: 疫情、反垄断与大模型
  macro: "2020 年，健康码与远程办公让互联网成为基础设施，网民规模达到 9.89 亿。2021 年，反垄断与未成年人防沉迷新规落地。2022 年，《互联网信息服务算法推荐管理规定》施行。2023 年，生成式 AI 管理办法出台，大模型成为新的入口之争。"
  pengcheng: "域名继续沉睡。偶尔有人通过 Wayback Machine 打开 2001 年的首页，看到'会员总数 4139'和'建议使用 IE 或 NETSCAPE 4.0 以上版本'，然后关掉页面。"
  highlight: false

- year: 2026
  title: "★ 域名回家"
  macro: "中国网民超过 11 亿，互联网从'新鲜事物'变成了空气和水。人们开始怀念 Web 1.0——不是怀念技术，而是怀念那个还没有被算法、平台和流量完全组织起来的年代。"
  pengcheng: "创始人的儿子把 pch88.com 和 鹏城.com 盘了回来。透过 Internet Archive，26 年前的首页重新出现。一代人搭建，一代人寻回。"
  highlight: true
